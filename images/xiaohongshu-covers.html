<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书封面合集</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    gap: 30px;
    padding: 40px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .cover {
    width: 540px;
    height: 720px;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 50px 40px;
    text-align: center;
  }

  /* Cover 1: Warm gradient */
  .cover-1 {
    background: linear-gradient(160deg, #1a1a2e 0%, #2d2440 30%, #4a2c3e 60%, #6b3a3a 100%);
  }

  .cover-1::before {
    content: '';
    position: absolute;
    width: 350px; height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,184,109,0.12), transparent 70%);
    top: -60px; right: -80px;
  }

  /* Cover 2: Cool tech */
  .cover-2 {
    background: linear-gradient(160deg, #0d1117 0%, #161b2b 30%, #1a2340 60%, #0f1f30 100%);
  }

  .cover-2::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(107,159,212,0.10), transparent 70%);
    bottom: -40px; left: -60px;
  }

  /* Cover 3: Calm green */
  .cover-3 {
    background: linear-gradient(160deg, #162822 0%, #1a2e2a 30%, #1f3028 60%, #1a2824 100%);
  }

  .cover-3::before {
    content: '';
    position: absolute;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(107,165,160,0.10), transparent 70%);
    top: 30%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .emoji-icon {
    font-size: 64px;
    margin-bottom: 24px;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
  }

  .cover-tag {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 14px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    margin-bottom: 28px;
    backdrop-filter: blur(10px);
  }

  .cover-1 .cover-tag { background: rgba(232,184,109,0.15); color: #e8b86d; }
  .cover-2 .cover-tag { background: rgba(107,159,212,0.15); color: #7eb8da; }
  .cover-3 .cover-tag { background: rgba(107,165,160,0.15); color: #7ec4be; }

  .cover-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 38px;
    font-weight: 900;
    color: #f0ebe3;
    line-height: 1.3;
    margin-bottom: 16px;
    letter-spacing: 0.04em;
  }

  .cover-subtitle {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 16px;
    color: #999;
    line-height: 1.6;
    max-width: 380px;
  }

  .cover-accent {
    display: block;
    width: 40px; height: 3px;
    border-radius: 3px;
    margin: 24px auto;
  }

  .cover-1 .cover-accent { background: #e8b86d; }
  .cover-2 .cover-accent { background: #6b9fd4; }
  .cover-3 .cover-accent { background: #6ba5a0; }

  .section-label {
    width: 100%;
    text-align: center;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 18px;
    color: #e0e0e0;
    margin-top: 12px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <span class="section-label">封面 1 — 种草帖</span>
    <div class="cover cover-1">
      <div class="emoji-icon">💚</div>
      <div class="cover-tag">开源推荐</div>
      <div class="cover-title">我发现了一个<br>宝藏AI心理咨询师</div>
      <div class="cover-accent"></div>
      <div class="cover-subtitle">免费 · 24小时在线 · 懂心理学<br>不是鸡汤，是真的CBT</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <span class="section-label">封面 2 — 测评帖</span>
    <div class="cover cover-2">
      <div class="emoji-icon">🔬</div>
      <div class="cover-tag">硬核测评</div>
      <div class="cover-title">AI心理咨询<br>真的靠谱吗？</div>
      <div class="cover-accent"></div>
      <div class="cover-subtitle">安全准确率 91.4%<br>致命漏检 0 · 红队全通过</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <span class="section-label">封面 3 — 科普帖</span>
    <div class="cover cover-3">
      <div class="emoji-icon">🧘</div>
      <div class="cover-tag">心理学知识</div>
      <div class="cover-title">CBT认知行为疗法<br>入门指南</div>
      <div class="cover-accent"></div>
      <div class="cover-subtitle">15种认知扭曲 + 解毒剂<br>普通人也能用的自我调节法</div>
    </div>
  </div>
</body>
</html>
