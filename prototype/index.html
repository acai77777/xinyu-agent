<style>
/* ========== CSS Variables - Apple-inspired warm palette ========== */
:root {
  --bg-body: #F0EDE8;
  --bg-phone: #FAFAF8;
  --bg-card: #FFFFFF;
  --bg-input: #F2F0ED;
  --bg-bubble-user: #3A7CA5;
  --bg-bubble-ai: #F2F0ED;
  --bg-nav: rgba(250, 250, 248, 0.85);
  --bg-tab: rgba(250, 250, 248, 0.92);
  --color-primary: #3A7CA5;
  --color-primary-light: #E8F2F8;
  --color-accent: #8B9DC3;
  --color-warm: #C4A882;
  --color-text: #1D1D1F;
  --color-text-secondary: #86868B;
  --color-text-tertiary: #AEAEB2;
  --color-border: #E5E5EA;
  --color-success: #6BBF8A;
  --color-warning: #F5A623;
  --color-danger: #E57373;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ========== Reset & Global ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-family);
  background: var(--bg-body);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}

/* ========== Phone Container ========== */
.phone-frame {
  width: 390px;
  height: 844px;
  background: var(--bg-phone);
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05);
}
.phone-screen {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ========== Status Bar (iOS style) ========== */
.status-bar {
  height: 54px;
  padding: 14px 28px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
  font-weight: 600;
  flex-shrink: 0;
}
.status-bar-right {
  display: flex;
  gap: 6px;
  align-items: center;
}

/* ========== Navigation Bar ========== */
.nav-bar {
  height: 52px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-nav);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--color-border);
  flex-shrink: 0;
  z-index: 10;
}
.nav-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.2px;
}
.nav-btn {
  background: none;
  border: none;
  font-size: 16px;
  color: var(--color-primary);
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 4px;
}
.nav-btn:hover { background: var(--color-primary-light); }

/* ========== Tab Bar ========== */
.tab-bar {
  height: 82px;
  padding: 6px 0 28px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: var(--bg-tab);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--color-border);
  flex-shrink: 0;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 16px;
  transition: var(--transition);
}
.tab-item svg { width: 24px; height: 24px; }
.tab-label {
  font-size: 10px;
  font-weight: 500;
  color: var(--color-text-tertiary);
}
.tab-item.active .tab-label { color: var(--color-primary); }
.tab-item.active svg { color: var(--color-primary); }

/* ========== Scrollable Content ========== */
.page-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.page-content::-webkit-scrollbar { display: none; }

/* ========== Common Components ========== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.card:hover { box-shadow: var(--shadow-md); }

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}

/* ========== Animations ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.fade-in { animation: fadeIn 0.3s ease-out; }
.slide-up { animation: slideUp 0.4s ease-out; }
</style>
<style>

}

.chat-nav {

.msg-row {

.msg-avatar-tiny {

.msg-row.ai .msg-bubble {

.chat-action-btn:hover { background: var(--bg-input); }

.chat-input-wrapper {

.toggle {

}

/* ========== Page Transitions ========== */
.page-enter { animation: fadeIn 0.25s ease-out; }

/* ========== Status Bar Component ========== */
function StatusBar() {
  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  return (
    <div className="status-bar">
      <span>{timeStr}</span>
      <div className="status-bar-right">
        <Icons.signal />
        <Icons.wifi />
        <Icons.battery />
      </div>
    </div>
  );
}

/* ========== Tab Bar Component ========== */
function TabBar({ active, onNavigate }) {
  const tabs = [
    { key: 'home', label: '首页', icon: Icons.home },
    { key: 'history', label: '记录', icon: Icons.history },
    { key: 'profile', label: '我的', icon: Icons.user },
  ];
  return (
    <div className="tab-bar">
      {tabs.map(tab => (
        <button
          key={tab.key}
          className={'tab-item' + (active === tab.key ? ' active' : '')}
          onClick={() => onNavigate(tab.key)}
        >
          <tab.icon />
          <span className="tab-label">{tab.label}</span>
        </button>
      ))}
    </div>
  );
}

/* ========== Chat Page ========== */
function ChatPage({ sessionId, onBack }) {
  const [messages, setMessages] = useState(INITIAL_MESSAGES);
  const [input, setInput] = useState('');
  const [isThinking, setIsThinking] = useState(false);
  const messagesEndRef = useRef(null);
  const inputRef = useRef(null);

  const scrollToBottom = useCallback(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, []);

  useEffect(() => { scrollToBottom(); }, [messages, isThinking]);

  const handleSend = useCallback(() => {
    const text = input.trim();
    if (!text || isThinking) return;

    const userMsg = {
      id: Date.now().toString(),
      role: 'user',
      content: text,
      time: new Date().getHours().toString().padStart(2,'0') + ':' + new Date().getMinutes().toString().padStart(2,'0'),
    };
    setMessages(prev => [...prev, userMsg]);
    setInput('');
    setIsThinking(true);

    // Simulate AI reply
    const delay = 1200 + Math.random() * 1500;
    setTimeout(() => {
      const reply = AI_REPLIES[Math.floor(Math.random() * AI_REPLIES.length)];
      const aiMsg = {
        id: (Date.now() + 1).toString(),
        role: 'ai',
        content: reply,
        time: new Date().getHours().toString().padStart(2,'0') + ':' + new Date().getMinutes().toString().padStart(2,'0'),
      };
      setMessages(prev => [...prev, aiMsg]);
      setIsThinking(false);
    }, delay);
  }, [input, isThinking]);

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  return (
    <div className="phone-screen">
      <StatusBar />
      <div className="nav-bar">
        <button className="nav-btn" onClick={onBack}>
          <Icons.back />
          <span>返回</span>
        </button>
        <div className="chat-nav">
          <div className="chat-avatar-small">🌿</div>
          <div className="chat-nav-info">
            <div className="chat-nav-name">心语</div>
            <div className="chat-nav-status">● 在线</div>
          </div>
        </div>
        <div style={{width: 60}} />
      </div>

      <div className="messages-area">
        {messages.map(msg => (
          <div key={msg.id} className={'msg-row ' + (msg.role === 'user' ? 'user' : 'ai')}>
            {msg.role === 'ai' && (
              <div className="msg-avatar-tiny" style={{background: 'linear-gradient(135deg, #E8F2F8, #F0E8F5)'}}>🌿</div>
            )}
            <div>
              <div className="msg-bubble">{msg.content}</div>
              <div className="msg-time">{msg.time}</div>
            </div>
          </div>
        ))}
        {isThinking && (
          <div className="thinking-dots">
            <div className="thinking-dot" />
            <div className="thinking-dot" />
            <div className="thinking-dot" />
          </div>
        )}
        <div ref={messagesEndRef} />
      </div>

      <div className="chat-input-bar">
        <div className="chat-input-actions">
          <button className="chat-action-btn" title="发送图片"><Icons.image /></button>
        </div>
        <div className="chat-input-wrapper">
          <input
            ref={inputRef}
            className="chat-input"
            placeholder="说说你的感受..."
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKeyDown}
          />
        </div>
        {input.trim() ? (
          <button className="send-btn" onClick={handleSend}><Icons.send /></button>
        ) : (
          <button className="chat-action-btn" title="语音输入"><Icons.mic /></button>
        )}
      </div>
    </div>
  );
}

/* ========== App Root ========== */
function App() {
  const [page, setPage] = useState('home');
  const [chatSessionId, setChatSessionId] = useState(null);

  const handleOpenChat = useCallback((id) => {
    setChatSessionId(id);
    setPage('chat');
  }, []);

  const handleNavigate = useCallback((target) => {
    setPage(target);
  }, []);

  const handleBackFromChat = useCallback(() => {
    setPage('home');
    setChatSessionId(null);
  }, []);

  switch (page) {
    case 'chat':
      return <ChatPage sessionId={chatSessionId} onBack={handleBackFromChat} />;
    case 'history':
      return <HistoryPage onOpenChat={handleOpenChat} onNavigate={handleNavigate} />;
    case 'profile':
      return <ProfilePage onNavigate={handleNavigate} />;
    default:
      return <HomePage onOpenChat={handleOpenChat} onNavigate={handleNavigate} />;
  }
}

/* ========== Render ========== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <div className="phone-frame">
    <App />
  </div>
);
</script>
