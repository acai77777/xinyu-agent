<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 200px; left: 80px; right: 80px; bottom: 160px; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 16px; font-weight: 500; }
.title { font-family: 'Noto Serif SC', serif; font-size: 60px; font-weight: 900; color: var(--deep-brown); line-height: 1.2; margin-bottom: 16px; }
.title .highlight { color: var(--caramel); }
.subtitle { font-size: 26px; color: var(--warm-gray); margin-bottom: 48px; }
.steps { display: flex; flex-direction: column; gap: 22px; }
.step { padding: 36px 40px; background: white; border: 1px solid var(--warm-beige); border-radius: 18px; display: flex; gap: 32px; align-items: flex-start; }
.step-num { font-family: 'Noto Serif SC', serif; font-size: 64px; font-weight: 900; color: var(--milk-tea); line-height: 1; flex-shrink: 0; width: 90px; }
.step-content { flex: 1; }
.step-name { font-family: 'Noto Serif SC', serif; font-size: 36px; font-weight: 700; color: var(--deep-brown); margin-bottom: 12px; }
.step-desc { font-size: 24px; color: var(--warm-gray); line-height: 1.6; margin-bottom: 12px; }
.step-q { font-family: 'Noto Serif SC', serif; font-size: 22px; color: var(--caramel); font-style: italic; line-height: 1.6; }
</style></head>
<body>
  <div class="bg-circle-tr"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">07 / 09</div>
  <div class="content">
    <div class="label">— 自 我 练 习 三 步 法</div>
    <div class="title">学会这三步<br>自己就能<span class="highlight">认知重构</span></div>
    <div class="subtitle">CBT 核心训练，每天 5 分钟</div>
    <div class="steps">
      <div class="step">
        <div class="step-num">01</div>
        <div class="step-content">
          <div class="step-name">觉察</div>
          <div class="step-desc">当负面情绪袭来时，立刻停下来</div>
          <div class="step-q">"刚才我脑子里闪过了什么想法？"</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">02</div>
        <div class="step-content">
          <div class="step-name">归类</div>
          <div class="step-desc">看看属于哪种认知扭曲</div>
          <div class="step-q">"是全或无？过度概括？还是灾难化？"</div>
        </div>
      </div>
      <div class="step">
        <div class="step-num">03</div>
        <div class="step-content">
          <div class="step-name">重构</div>
          <div class="step-desc">寻找更平衡的视角</div>
          <div class="step-q">"如果好朋友这样想，我会怎么劝他？"</div>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom-marker">把它写下来效果更好</div>
</body></html>
