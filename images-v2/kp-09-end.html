<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 50%; left: 80px; right: 80px; transform: translateY(-50%); text-align: center; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.3em; margin-bottom: 48px; font-weight: 500; }
.quote-mark { font-family: 'Noto Serif SC', serif; font-size: 120px; color: var(--milk-tea); line-height: 0.6; margin-bottom: 24px; opacity: 0.4; }
.main-quote { font-family: 'Noto Serif SC', serif; font-size: 64px; font-weight: 900; color: var(--deep-brown); line-height: 1.5; margin-bottom: 16px; }
.main-quote .highlight { color: var(--caramel); }
.divider { width: 60px; height: 2px; background: var(--milk-tea); margin: 36px auto; }
.sub-quote { font-family: 'Noto Serif SC', serif; font-size: 28px; color: var(--warm-gray); line-height: 1.7; font-weight: 400; margin-bottom: 56px; }
.attribution { font-size: 22px; color: var(--light-gray); letter-spacing: 0.1em; margin-bottom: 64px; }
.cta-card { display: inline-block; padding: 28px 48px; background: var(--milk-tea); color: white; border-radius: 16px; }
.cta-label { font-size: 20px; opacity: 0.85; letter-spacing: 0.15em; margin-bottom: 8px; }
.cta-text { font-family: 'Noto Serif SC', serif; font-size: 32px; font-weight: 700; }
</style></head>
<body>
  <div class="bg-circle-tr"></div><div class="bg-circle-bl"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">09 / 09</div>
  <div class="content">
    <div class="label">写 在 最 后</div>
    <div class="quote-mark">"</div>
    <div class="main-quote">想法只是想法<br>不一定是<span class="highlight">事实</span></div>
    <div class="divider"></div>
    <div class="sub-quote">CBT 不是积极思考<br>而是有意识地审视自己的思维模式<br>用更平衡的视角替代扭曲的解读</div>
    <div class="attribution">— 心 语 XINYU</div>
    <div class="cta-card">
      <div class="cta-label">FOLLOW</div>
      <div class="cta-text">每 天 学 点 心 理 学</div>
    </div>
  </div>
</body></html>
