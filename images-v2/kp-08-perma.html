<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 200px; left: 80px; right: 80px; bottom: 160px; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 16px; font-weight: 500; }
.title { font-family: 'Noto Serif SC', serif; font-size: 56px; font-weight: 900; color: var(--deep-brown); line-height: 1.2; margin-bottom: 16px; }
.title .highlight { color: var(--caramel); }
.subtitle { font-size: 24px; color: var(--warm-gray); margin-bottom: 40px; }
.perma-list { display: flex; flex-direction: column; gap: 16px; }
.perma-row { display: flex; gap: 24px; align-items: center; padding: 24px 28px; background: white; border: 1px solid var(--warm-beige); border-radius: 14px; }
.letter { font-family: 'Noto Serif SC', serif; font-size: 56px; font-weight: 900; color: var(--milk-tea); line-height: 1; width: 70px; flex-shrink: 0; text-align: center; }
.perma-info { flex: 1; }
.perma-name { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700; color: var(--deep-brown); margin-bottom: 4px; }
.perma-en { font-size: 18px; color: var(--warm-gray); letter-spacing: 0.05em; margin-bottom: 8px; }
.perma-action { font-size: 22px; color: var(--caramel); font-weight: 500; }
</style></head>
<body>
  <div class="bg-circle-tr"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">08 / 09</div>
  <div class="content">
    <div class="label">— 积 极 心 理 学</div>
    <div class="title">PERMA 幸福模型<br>追求幸福的<span class="highlight">五个维度</span></div>
    <div class="subtitle">Martin Seligman · 积极心理学之父</div>
    <div class="perma-list">
      <div class="perma-row">
        <div class="letter">P</div>
        <div class="perma-info">
          <div class="perma-name">积极情绪</div>
          <div class="perma-en">Positive Emotion</div>
          <div class="perma-action">→ 三件好事日记</div>
        </div>
      </div>
      <div class="perma-row">
        <div class="letter">E</div>
        <div class="perma-info">
          <div class="perma-name">投入</div>
          <div class="perma-en">Engagement</div>
          <div class="perma-action">→ 进入心流状态</div>
        </div>
      </div>
      <div class="perma-row">
        <div class="letter">R</div>
        <div class="perma-info">
          <div class="perma-name">关系</div>
          <div class="perma-en">Relationships</div>
          <div class="perma-action">→ 主动联系一位朋友</div>
        </div>
      </div>
      <div class="perma-row">
        <div class="letter">M</div>
        <div class="perma-info">
          <div class="perma-name">意义</div>
          <div class="perma-en">Meaning</div>
          <div class="perma-action">→ 服务比自己更大的事物</div>
        </div>
      </div>
      <div class="perma-row">
        <div class="letter">A</div>
        <div class="perma-info">
          <div class="perma-name">成就</div>
          <div class="perma-en">Accomplishment</div>
          <div class="perma-action">→ 设定并完成小目标</div>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom-marker">幸福是可以练习出来的</div>
</body></html>
