<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 200px; left: 80px; right: 80px; bottom: 160px; display: flex; flex-direction: column; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 12px; font-weight: 500; }
.dist-num { font-family: 'Noto Serif SC', serif; font-size: 28px; color: var(--milk-tea); font-weight: 600; margin-bottom: 16px; letter-spacing: 0.1em; }
.dist-name { font-family: 'Noto Serif SC', serif; font-size: 96px; font-weight: 900; color: var(--deep-brown); line-height: 1.1; margin-bottom: 12px; }
.dist-en { font-size: 22px; color: var(--warm-gray); letter-spacing: 0.15em; margin-bottom: 40px; }
.def-box { padding: 32px 36px; background: white; border: 1px solid var(--warm-beige); border-radius: 16px; margin-bottom: 24px; }
.def-label { font-size: 20px; color: var(--milk-tea); letter-spacing: 0.15em; margin-bottom: 12px; font-weight: 600; }
.def-text { font-family: 'Noto Serif SC', serif; font-size: 30px; color: var(--deep-brown); line-height: 1.5; font-weight: 500; }
.example-box { padding: 28px 32px; background: var(--warm-white); border-left: 4px solid var(--milk-tea); border-radius: 4px; margin-bottom: 24px; }
.example-label { font-size: 20px; color: var(--milk-tea); letter-spacing: 0.15em; margin-bottom: 12px; font-weight: 600; }
.example-quote { font-family: 'Noto Serif SC', serif; font-size: 26px; color: var(--deep-brown); line-height: 1.6; font-style: italic; }
.antidote { margin-top: auto; padding: 28px 32px; background: var(--soft-green-bg); border-radius: 16px; display: flex; align-items: center; gap: 20px; }
.pill { padding: 8px 18px; border-radius: 20px; background: var(--soft-green); color: white; font-size: 20px; font-weight: 600; flex-shrink: 0; }
.antidote-text { font-size: 24px; color: var(--deep-brown); line-height: 1.5; }
</style></head>
<body>
  <div class="bg-circle-tr"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">04 / 09</div>
  <div class="content">
    <div class="label">— 认 知 扭 曲</div>
    <div class="dist-num">EXAMPLE 02</div>
    <div class="dist-name">过度概括</div>
    <div class="dist-en">OVERGENERALIZATION</div>
    <div class="def-box">
      <div class="def-label">— 定 义</div>
      <div class="def-text">从单一事件推出普遍性结论<br>一次失败 = 永远失败</div>
    </div>
    <div class="example-box">
      <div class="example-label">— 典 型 想 法</div>
      <div class="example-quote">"我每次都搞砸"<br>"没有人真的喜欢我"</div>
    </div>
    <div class="antidote">
      <span class="pill">解 毒 剂</span>
      <span class="antidote-text">寻找反面证据<br>真的"每次"都搞砸吗？列出反例</span>
    </div>
  </div>
</body></html>
