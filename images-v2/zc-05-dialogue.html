<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 180px; left: 80px; right: 80px; bottom: 160px; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 16px; font-weight: 500; }
.title { font-family: 'Noto Serif SC', serif; font-size: 56px; font-weight: 900; color: var(--deep-brown); line-height: 1.3; margin-bottom: 48px; }
.dialogue { display: flex; flex-direction: column; gap: 20px; }
.bubble { padding: 24px 28px; border-radius: 20px; max-width: 85%; font-size: 26px; line-height: 1.6; }
.user-bubble { align-self: flex-end; background: var(--milk-tea); color: white; border-bottom-right-radius: 6px; }
.ai-bubble { align-self: flex-start; background: white; border: 1px solid var(--warm-beige); color: var(--deep-brown); border-bottom-left-radius: 6px; }
.ai-bubble .role { font-size: 18px; color: var(--milk-tea); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.05em; }
.ai-bubble .tag { display: inline-block; padding: 3px 12px; background: var(--tea-rose-bg); color: var(--tea-rose); border-radius: 10px; font-size: 18px; margin-top: 12px; }
</style></head>
<body>
  <div class="bg-circle-tr"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">05 / 06</div>
  <div class="content">
    <div class="label">— 真 实 对 话 片 段</div>
    <div class="title">不灌鸡汤<br>而是帮你重新看自己</div>
    <div class="dialogue">
      <div class="bubble user-bubble">我觉得自己好失败<br>什么都做不好</div>
      <div class="bubble ai-bubble">
        <div class="role">心语</div>
        听到了一个"标签化"的认知模式。一件事没做好，不等于你这个人"是个废物"。
        <span class="tag">认知扭曲：标签化</span>
      </div>
      <div class="bubble ai-bubble">
        <div class="role">心语</div>
        要不要做个小练习？说出今天你做对的三件事，哪怕很小的事情也可以。
      </div>
      <div class="bubble user-bubble">完成了汇报、帮同事修了bug、按时吃了午饭…</div>
      <div class="bubble ai-bubble">
        <div class="role">心语</div>
        你看，刚才已经找到三件做对的事。<br>这些事实，和你说的"废物"，对得上吗？
        <span class="tag">苏格拉底式提问</span>
      </div>
    </div>
  </div>
  <div class="bottom-marker">真正的 CBT 干预</div>
</body></html>
