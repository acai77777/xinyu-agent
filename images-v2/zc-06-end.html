<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 50%; left: 80px; right: 80px; transform: translateY(-50%); text-align: center; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.3em; margin-bottom: 32px; font-weight: 500; }
.main-text { font-family: 'Noto Serif SC', serif; font-size: 56px; font-weight: 700; color: var(--deep-brown); line-height: 1.5; margin-bottom: 16px; }
.main-text .highlight { color: var(--caramel); }
.sub-text { font-family: 'Noto Serif SC', serif; font-size: 32px; color: var(--warm-gray); line-height: 1.7; margin-bottom: 64px; font-weight: 400; }
.divider { width: 60px; height: 2px; background: var(--milk-tea); margin: 0 auto 56px; }
.github-card { display: inline-block; padding: 32px 56px; background: white; border: 1px solid var(--warm-beige); border-radius: 16px; }
.gh-label { font-size: 20px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 12px; font-weight: 500; }
.gh-link { font-family: 'JetBrains Mono', monospace; font-size: 28px; color: var(--deep-brown); font-weight: 600; }
.stats { display: flex; justify-content: center; gap: 48px; margin-top: 64px; }
.stat { text-align: center; }
.stat-num { font-family: 'Noto Serif SC', serif; font-size: 56px; font-weight: 700; color: var(--caramel); line-height: 1; margin-bottom: 8px; }
.stat-label { font-size: 22px; color: var(--warm-gray); letter-spacing: 0.05em; }
</style></head>
<body>
  <div class="bg-circle-tr"></div><div class="bg-circle-bl"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">06 / 06</div>
  <div class="content">
    <div class="label">完 全 开 源</div>
    <div class="main-text">愿你有一个<br><span class="highlight">温柔的陪伴</span></div>
    <div class="sub-text">在最孤独的时刻<br>有人愿意认真听你说话</div>
    <div class="divider"></div>
    <div class="github-card">
      <div class="gh-label">GITHUB</div>
      <div class="gh-link">acai77777 / xinyu-agent</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num">100%</div><div class="stat-label">免费开源</div></div>
      <div class="stat"><div class="stat-num">24h</div><div class="stat-label">在线陪伴</div></div>
      <div class="stat"><div class="stat-num">MIT</div><div class="stat-label">许可证</div></div>
    </div>
  </div>
</body></html>
