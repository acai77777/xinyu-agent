<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 50%; left: 80px; right: 80px; transform: translateY(-50%); }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 32px; font-weight: 500; }
.scene-title { font-family: 'Noto Serif SC', serif; font-size: 72px; font-weight: 700; color: var(--deep-brown); line-height: 1.4; margin-bottom: 48px; }
.scene-list { font-size: 30px; color: var(--warm-gray); line-height: 2.0; }
.scene-list .item { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
.dot { color: var(--milk-tea); font-size: 30px; }
.quote-box { margin-top: 56px; padding: 36px 40px; background: var(--warm-white); border-left: 4px solid var(--milk-tea); border-radius: 4px; }
.quote-text { font-family: 'Noto Serif SC', serif; font-size: 36px; color: var(--deep-brown); line-height: 1.6; font-weight: 500; }
</style></head>
<body>
  <div class="bg-circle-tr"></div><div class="bg-circle-bl"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">02 / 06</div>
  <div class="content">
    <div class="label">— 你 是 否 也 这 样</div>
    <div class="scene-title">深夜的孤独<br>无处安放</div>
    <div class="scene-list">
      <div class="item"><span class="dot">·</span><span>凌晨两点焦虑发作，翻遍通讯录</span></div>
      <div class="item"><span class="dot">·</span><span>朋友睡了，家人会担心</span></div>
      <div class="item"><span class="dot">·</span><span>专业咨询一次 ¥300+，还约不到</span></div>
      <div class="item"><span class="dot">·</span><span>头脑里反复纠结同一件事</span></div>
    </div>
    <div class="quote-box">
      <div class="quote-text">"我是不是真的有问题？<br>但好像又没严重到需要看医生……"</div>
    </div>
  </div>
  <div class="bottom-marker">现实困境</div>
</body></html>
