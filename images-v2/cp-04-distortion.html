<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 200px; left: 80px; right: 80px; bottom: 160px; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 16px; font-weight: 500; }
.title { font-family: 'Noto Serif SC', serif; font-size: 60px; font-weight: 900; color: var(--deep-brown); line-height: 1.2; margin-bottom: 48px; }
.score-banner { padding: 32px 40px; background: var(--milk-tea); border-radius: 16px; color: white; display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
.banner-text { font-family: 'Noto Serif SC', serif; font-size: 30px; font-weight: 700; }
.banner-score { font-family: 'Noto Serif SC', serif; font-size: 44px; font-weight: 900; }
.test-list { display: flex; flex-direction: column; gap: 14px; }
.test-row { padding: 22px 28px; background: white; border: 1px solid var(--warm-beige); border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.test-name { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700; color: var(--deep-brown); width: 200px; flex-shrink: 0; }
.test-quote { flex: 1; font-size: 22px; color: var(--warm-gray); font-style: italic; }
.check { color: var(--soft-green); font-size: 28px; font-weight: 700; }
</style></head>
<body>
  <div class="bg-circle-tr"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">04 / 07</div>
  <div class="content">
    <div class="label">— 测 评 二 · 认 知 扭 曲</div>
    <div class="title">15 种思维模式<br>命中率全开</div>
    <div class="score-banner">
      <div class="banner-text">六大典型扭曲全部识别</div>
      <div class="banner-score">6 / 6</div>
    </div>
    <div class="test-list">
      <div class="test-row">
        <div class="test-name">全或无思维</div>
        <div class="test-quote">"要么完美，要么失败"</div>
        <div class="check">✓</div>
      </div>
      <div class="test-row">
        <div class="test-name">过度概括</div>
        <div class="test-quote">"我每次都搞砸"</div>
        <div class="check">✓</div>
      </div>
      <div class="test-row">
        <div class="test-name">灾难化</div>
        <div class="test-quote">"万一被开除我就完了"</div>
        <div class="check">✓</div>
      </div>
      <div class="test-row">
        <div class="test-name">情绪推理</div>
        <div class="test-quote">"觉得害怕所以一定危险"</div>
        <div class="check">✓</div>
      </div>
      <div class="test-row">
        <div class="test-name">应该陈述</div>
        <div class="test-quote">"我应该更努力的"</div>
        <div class="check">✓</div>
      </div>
      <div class="test-row">
        <div class="test-name">标签化</div>
        <div class="test-quote">"我就是个废物"</div>
        <div class="check">✓</div>
      </div>
    </div>
  </div>
  <div class="bottom-marker">中文表达也能精准捕捉</div>
</body></html>
