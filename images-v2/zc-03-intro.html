<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 50%; left: 80px; right: 80px; transform: translateY(-50%); }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 24px; font-weight: 500; }
.brand-name { font-family: 'Noto Serif SC', serif; font-size: 140px; font-weight: 900; color: var(--deep-brown); line-height: 1; letter-spacing: 0.06em; margin-bottom: 8px; }
.brand-en { font-size: 36px; color: var(--milk-tea); letter-spacing: 0.3em; font-weight: 400; margin-bottom: 48px; }
.divider { width: 80px; height: 2px; background: var(--milk-tea); margin-bottom: 40px; }
.desc { font-size: 32px; color: var(--deep-brown); line-height: 1.7; margin-bottom: 40px; font-weight: 400; }
.desc strong { color: var(--caramel); font-weight: 600; }
.theory-row { display: flex; gap: 16px; margin-top: 48px; }
.theory-card { flex: 1; padding: 28px 24px; background: white; border: 1px solid var(--warm-beige); border-radius: 12px; }
.theory-num { font-family: 'Noto Serif SC', serif; font-size: 28px; color: var(--milk-tea); font-weight: 700; margin-bottom: 8px; }
.theory-name { font-family: 'Noto Serif SC', serif; font-size: 30px; font-weight: 700; color: var(--deep-brown); margin-bottom: 8px; }
.theory-en { font-size: 18px; color: var(--warm-gray); letter-spacing: 0.05em; }
</style></head>
<body>
  <div class="bg-circle-tr"></div><div class="bg-circle-bl"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">03 / 06</div>
  <div class="content">
    <div class="label">— 它 是 什 么</div>
    <div class="brand-name">心 语</div>
    <div class="brand-en">XINYU</div>
    <div class="divider"></div>
    <div class="desc">一款融合 <strong>认知行为疗法（CBT）</strong> 与<br><strong>积极心理学</strong> 的 AI 心理健康伴侣</div>
    <div class="theory-row">
      <div class="theory-card">
        <div class="theory-num">01</div>
        <div class="theory-name">认知行为疗法</div>
        <div class="theory-en">Cognitive Behavioral Therapy</div>
      </div>
      <div class="theory-card">
        <div class="theory-num">02</div>
        <div class="theory-name">积极心理学</div>
        <div class="theory-en">Positive Psychology</div>
      </div>
    </div>
  </div>
  <div class="bottom-marker">基于真实心理学理论</div>
</body></html>
