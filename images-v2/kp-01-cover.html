<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 50%; left: 80px; right: 80px; transform: translateY(-50%); }
.number { font-family: 'Noto Serif SC', serif; font-size: 200px; font-weight: 300; color: var(--warm-beige); line-height: 0.8; margin-bottom: 30px; }
.main-title { font-family: 'Noto Serif SC', serif; font-size: 100px; font-weight: 900; color: var(--deep-brown); line-height: 1.2; letter-spacing: 0.04em; margin-bottom: 16px; }
.cbt-text { font-family: 'Noto Serif SC', serif; font-size: 38px; color: var(--milk-tea); letter-spacing: 0.3em; font-weight: 500; margin-bottom: 32px; }
.subtitle { font-family: 'Noto Serif SC', serif; font-size: 36px; color: var(--warm-gray); line-height: 1.6; margin-bottom: 56px; font-weight: 400; }
.tags { display: flex; flex-wrap: wrap; gap: 14px; }
.tag { padding: 12px 26px; border-radius: 30px; background: white; border: 1px solid var(--warm-beige); font-size: 24px; font-weight: 500; color: var(--caramel); }
.tag.filled { background: var(--milk-tea); color: white; border-color: var(--milk-tea); }
.stamp { position: absolute; bottom: 80px; right: 80px; width: 100px; height: 100px; border: 1.5px solid var(--milk-tea); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--milk-tea); }
.stamp-emoji { font-size: 32px; margin-bottom: 4px; }
.stamp-text { font-family: 'Noto Serif SC', serif; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; }
</style></head>
<body>
  <div class="bg-circle-tr"></div><div class="bg-circle-bl"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="content">
    <div class="number">03</div>
    <div class="cbt-text">C B T</div>
    <div class="main-title">认知行为<br>疗法入门</div>
    <div class="subtitle">不是心理学家也能看懂的<br>自我调节方法</div>
    <div class="tags">
      <span class="tag filled">心理学科普</span>
      <span class="tag">15 种认知扭曲</span>
      <span class="tag">PERMA 模型</span>
    </div>
  </div>
  <div class="bottom-marker">人人都能学会的方法</div>
  <div class="stamp"><div class="stamp-emoji">🧘</div><div class="stamp-text">LEARN</div></div>
</body></html>
