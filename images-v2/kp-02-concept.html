<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 200px; left: 80px; right: 80px; bottom: 160px; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 16px; font-weight: 500; }
.title { font-family: 'Noto Serif SC', serif; font-size: 56px; font-weight: 900; color: var(--deep-brown); line-height: 1.3; margin-bottom: 48px; }
.title .highlight { color: var(--caramel); }
.flow { display: flex; flex-direction: column; gap: 18px; margin-bottom: 40px; }
.flow-row { display: flex; gap: 16px; align-items: stretch; }
.flow-step { flex: 1; padding: 24px 20px; border-radius: 14px; text-align: center; background: white; border: 1px solid var(--warm-beige); }
.step-num { font-size: 18px; color: var(--milk-tea); font-weight: 600; letter-spacing: 0.1em; margin-bottom: 8px; }
.step-name { font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 700; color: var(--deep-brown); }
.arrow { display: flex; align-items: center; color: var(--milk-tea); font-size: 28px; }
.example { padding: 36px 40px; background: var(--warm-white); border-radius: 16px; }
.example-title { font-size: 22px; color: var(--milk-tea); letter-spacing: 0.1em; margin-bottom: 20px; font-weight: 600; }
.example-row { display: flex; gap: 24px; margin-bottom: 16px; align-items: baseline; }
.example-row:last-child { margin-bottom: 0; }
.label-tag { padding: 4px 14px; border-radius: 12px; font-size: 18px; font-weight: 600; flex-shrink: 0; }
.label-tag.event { background: var(--warm-beige); color: var(--deep-brown); }
.label-tag.thought { background: var(--milk-tea); color: white; }
.label-tag.emotion { background: var(--tea-rose); color: white; }
.example-text { font-size: 24px; color: var(--deep-brown); line-height: 1.5; }
</style></head>
<body>
  <div class="bg-circle-tr"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">02 / 09</div>
  <div class="content">
    <div class="label">— C B T 核 心 理 念</div>
    <div class="title">情绪不是来自事件本身<br>而是来自你<span class="highlight">解读它的方式</span></div>
    <div class="flow">
      <div class="flow-row">
        <div class="flow-step"><div class="step-num">STEP 01</div><div class="step-name">事件</div></div>
        <div class="arrow">→</div>
        <div class="flow-step"><div class="step-num">STEP 02</div><div class="step-name">想法</div></div>
        <div class="arrow">→</div>
        <div class="flow-step"><div class="step-num">STEP 03</div><div class="step-name">情绪</div></div>
        <div class="arrow">→</div>
        <div class="flow-step"><div class="step-num">STEP 04</div><div class="step-name">行为</div></div>
      </div>
    </div>
    <div class="example">
      <div class="example-title">同 样 的 事 件 · 不 同 的 解 读</div>
      <div class="example-row">
        <span class="label-tag event">事件</span>
        <span class="example-text">老板没有回复你的消息</span>
      </div>
      <div class="example-row">
        <span class="label-tag thought">A 想法</span>
        <span class="example-text">"他不重视我" → <strong style="color:var(--tea-rose);">焦虑</strong></span>
      </div>
      <div class="example-row">
        <span class="label-tag thought">B 想法</span>
        <span class="example-text">"他可能在开会" → <strong style="color:var(--soft-green);">平静</strong></span>
      </div>
    </div>
  </div>
  <div class="bottom-marker">改变想法 = 改变情绪</div>
</body></html>
