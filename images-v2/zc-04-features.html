<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css">
<style>
.content { position: absolute; top: 180px; left: 80px; right: 80px; bottom: 160px; }
.label { font-size: 24px; color: var(--milk-tea); letter-spacing: 0.2em; margin-bottom: 16px; font-weight: 500; }
.title { font-family: 'Noto Serif SC', serif; font-size: 64px; font-weight: 900; color: var(--deep-brown); line-height: 1.2; margin-bottom: 56px; }
.title .highlight { color: var(--caramel); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.feature { padding: 32px 28px; background: white; border-radius: 16px; border: 1px solid var(--warm-beige); position: relative; }
.feature-num { font-family: 'Noto Serif SC', serif; font-size: 28px; color: var(--milk-tea); font-weight: 700; margin-bottom: 16px; }
.feature-name { font-family: 'Noto Serif SC', serif; font-size: 32px; font-weight: 700; color: var(--deep-brown); margin-bottom: 12px; }
.feature-desc { font-size: 22px; color: var(--warm-gray); line-height: 1.6; }
.feature.highlight-card { background: var(--milk-tea); border-color: var(--milk-tea); }
.feature.highlight-card .feature-num,
.feature.highlight-card .feature-name { color: white; }
.feature.highlight-card .feature-desc { color: rgba(255,255,255,0.85); }
</style></head>
<body>
  <div class="bg-circle-tr"></div>
  <div class="brand-tag">XINYU · 心语</div>
  <div class="page-num">04 / 06</div>
  <div class="content">
    <div class="label">— 五 大 核 心 功 能</div>
    <div class="title">不是聊天机器人<br>是<span class="highlight">真正的 AI 助手</span></div>
    <div class="grid">
      <div class="feature highlight-card">
        <div class="feature-num">01</div>
        <div class="feature-name">情绪识别</div>
        <div class="feature-desc">19 类精细情绪分类<br>读懂细微感受</div>
      </div>
      <div class="feature">
        <div class="feature-num">02</div>
        <div class="feature-name">认知扭曲</div>
        <div class="feature-desc">15 种思维模式检测<br>识别非理性想法</div>
      </div>
      <div class="feature">
        <div class="feature-num">03</div>
        <div class="feature-name">CBT 干预</div>
        <div class="feature-desc">苏格拉底式提问<br>引导认知重构</div>
      </div>
      <div class="feature">
        <div class="feature-num">04</div>
        <div class="feature-name">心理量表</div>
        <div class="feature-desc">PHQ-9 / GAD-7<br>标准化自我评估</div>
      </div>
      <div class="feature">
        <div class="feature-num">05</div>
        <div class="feature-name">语音交互</div>
        <div class="feature-desc">说话就能聊天<br>不打字也能倾诉</div>
      </div>
      <div class="feature">
        <div class="feature-num">06</div>
        <div class="feature-name">长期记忆</div>
        <div class="feature-desc">记住你的故事<br>不用每次重新讲</div>
      </div>
    </div>
  </div>
  <div class="bottom-marker">功能一览</div>
</body></html>
